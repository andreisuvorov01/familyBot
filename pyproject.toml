[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "alembic/versions"

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["app"]
skip_glob = ["alembic/versions/*"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# aiogram: callback.message типизирован как Message | InaccessibleMessage | None,
# а обработчики работают только с доступными сообщениями
[[tool.mypy.overrides]]
module = ["app.bot.handlers.*"]
disable_error_code = ["union-attr"]
